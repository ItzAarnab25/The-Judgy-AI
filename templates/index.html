<!DOCTYPE html>
<html>
<head>
    <title>Party Photo Booth!</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bangers&family=Montserrat:wght@400;700&display=swap');

        body {
            font-family: 'Montserrat', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            background-color: #FF6B6B; /* Vibrant Red */
            margin: 0;
            padding: 30px;
            box-sizing: border-box;
            background-image: radial-gradient(circle, rgba(255, 218, 185, 0.2) 20%, transparent 60%), /* Peach puff highlights */
                              linear-gradient(45deg, rgba(255, 255, 0, 0.15) 15%, transparent 50%), /* Yellow streaks */
                              linear-gradient(-45deg, rgba(0, 255, 255, 0.1) 25%, transparent 65%); /* Cyan hints */
            color: #333; /* Dark gray for text */
            position: relative; /* To position the confetti canvas */
            overflow-x: hidden;  /* Prevent horizontal scrollbar */
            overflow-y: auto;    /* Enable vertical scrollbar */
        }

        #app-container {
            background-color: rgba(255, 255, 255, 0.85); /* Semi-transparent white */
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            padding: 50px;
            text-align: center;
            width: 95%;
            max-width: 600px; /* Increased max-width for potentially larger screenshot */
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 4px solid #FFA07A; /* Light Salmon border */
            position: relative; /* For stacking context with confetti */
            z-index: 1; /* Ensure it's above the confetti */
            margin-bottom: 20px; /* Add margin to the bottom to prevent content overlap with fixed confetti */
        }

        h1 {
            font-family: 'Bangers', cursive;
            color: #FFD700; /* Bright Yellow */
            margin-bottom: 20px; /* Reduced margin */
            font-size: 3rem;
            text-shadow: 3px 3px 5px rgba(0, 0, 0, 0.4);
            letter-spacing: 1.5px;
        }

        #camera-container {
            width: 240px; /* Increased size */
            height: 240px; /* Increased size */
            border: 5px solid #F08080; /* Light Coral border */
            position: relative;
            overflow: hidden;
            border-radius: 50%;
            margin-bottom: 20px; /* Reduced margin */
            display: flex;
            justify-content: center;
            align-items: center;
            transition: border-color 0.3s ease-in-out, border-width 0.3s ease-in-out; /* Added transition for border-width */
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.2);
            cursor: pointer; /* Make it clickable */
            border-width: 5px; /* Initial border width */
        }

        #camera-container.active {
            border-color: #00CED1; /* Turquoise when active */
        }

        #camera-container.captured {
            border-width: 10px; /* Increased border width when captured */
            border-color: #FFA07A; /* Change border color when captured */
        }

        #camera-feed, #captured-image-display {
            width: auto;
            height: auto;
            min-width: 100%;
            min-height: 100%;
            object-fit: cover;
        }

        #camera-feed.no-mirror {
            transform: scaleX(1);
        }

        #camera-feed {
            transform: scaleX(-1);
            display: block; /* Initially show the feed */
        }

        #captured-image-display {
            display: none; /* Initially hidden */
        }

        #capture-flip-container {
            display: flex;
            justify-content: center;
            margin-bottom: 20px; /* Reduced margin */
        }

        #capture-btn,
        #flip-btn,
        #share-btn {
            background-color: #00CED1; /* Turquoise buttons */
            color: white;
            border: none;
            border-radius: 50%;
            width: 80px;
            height: 80px;
            font-size: 1.8rem;
            cursor: pointer;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s ease-in-out, background-color 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
            outline: none;
            margin: 0 15px; /* Adjusted margin */
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
        }

        #capture-btn:hover,
        #flip-btn:hover,
        #share-btn:hover {
            transform: scale(1.1);
            background-color: #40E0D0; /* Brighter Turquoise on hover */
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.35);
        }

        #capture-btn:active,
        #flip-btn:active,
        #share-btn:active {
            transform: scale(0.95);
            box-shadow: 0 3px 7px rgba(0, 0, 0, 0.25);
        }

        #comment-container {
            margin-top: 30px; /* Adjusted margin */
            padding: 20px; /* Adjusted padding */
            border: 3px dashed #FFD700; /* Bright Yellow dashed border */
            border-radius: 15px;
            background-color: rgba(255, 215, 0, 0.15); /* Light Yellow background */
            text-align: center;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.2);
        }

        #comment-container.show {
            opacity: 1;
            transform: translateY(0);
        }

        #comment-container h2 {
            font-family: 'Bangers', cursive;
            color: #FF6B6B; /* Vibrant Red for comment heading */
            font-size: 1.8rem; /* Adjusted font size */
            margin-bottom: 15px; /* Adjusted margin */
            text-shadow: 2px 2px 3px rgba(0, 0, 0, 0.3);
            letter-spacing: 1px;
        }

        #comment {
            font-style: italic;
            color: #555; /* Darker gray for comment text */
            font-size: 1.2rem; /* Adjusted font size */
            line-height: 1.6; /* Adjusted line height */
        }

        .hidden {
            display: none;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 0.9;
            }
            50% {
                transform: scale(1.05);
                opacity: 1;
            }
            100% {
                transform: scale(1);
                opacity: 0.9;
            }
        }

        #camera-container.pulsing {
            animation: pulse 1.5s infinite alternate;
        }

        /* Confetti styles */
        canvas#confetti-canvas {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 10; /* Place it above the background but below app-container */
            pointer-events: none;
        }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <canvas id="confetti-canvas"></canvas>
    <div id="app-container">
        <h1>Say Cheese!</h1>
        <div id="camera-container" class="pulsing">
            <video id="camera-feed" autoplay playsinline></video>
            <img id="captured-image-display" style="display: none;">
        </div>
        <div id="capture-flip-container">
            <button id="capture-btn">🎉</button>
            <button id="flip-btn">🔄</button>
            <button id="share-btn" class="hidden">📤</button>
        </div>
        <canvas id="canvas" width="240" height="240" class="hidden"></canvas> <canvas id="share-canvas" class="hidden"></canvas>
        <div id="comment-container" class="hidden">
            <h2>Get Ready to Laugh!</h2>
            <p id="comment"></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/js-confetti@latest/dist/js-confetti.browser.js"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <script>
        const cameraFeed = document.getElementById('camera-feed');
        const capturedImageDisplay = document.getElementById('captured-image-display');
        const cameraContainer = document.getElementById('camera-container');
        const captureBtn = document.getElementById('capture-btn');
        const canvas = document.getElementById('canvas');
        const shareCanvas = document.getElementById('share-canvas');
        const commentContainer = document.getElementById('comment-container');
        const commentDisplay = document.querySelector('#comment-container #comment');
        const flipBtn = document.getElementById('flip-btn');
        const shareBtn = document.getElementById('share-btn');
        const confettiCanvas = document.getElementById('confetti-canvas');
        const jsConfetti = new JSConfetti({ canvas: confettiCanvas });
        let stream;
        let isPaused = false;
        let facingMode = 'user';
        let capturedImageDataURL;
        let geminiComment;
        let showingCapturedImage = false;

        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facingMode }, audio: false });
                cameraFeed.srcObject = stream;
                cameraContainer.classList.add('active');
                cameraContainer.classList.remove('pulsing');
                cameraContainer.classList.remove('captured'); // Remove captured class
                capturedImageDisplay.style.display = 'none';
                cameraFeed.style.display = 'block';
                showingCapturedImage = false;
                updateVideoMirror();
                console.log("Camera started successfully with facing mode:", facingMode);
            } catch (err) {
                console.error("Error accessing camera: ", err);
                alert("Failed to access camera. Please check your browser permissions.");
                cameraContainer.classList.remove('active');
            }
        }

        function updateVideoMirror() {
            if (facingMode === 'user') {
                cameraFeed.classList.remove('no-mirror');
                cameraFeed.style.transform = 'scaleX(-1)';
            } else {
                cameraFeed.classList.add('no-mirror');
                cameraFeed.style.transform = 'scaleX(1)';
            }
        }

        async function capturePhoto() {
            if (!stream) {
                alert("Camera not started yet.");
                return;
            }

            cameraFeed.pause();
            isPaused = true;
            cameraContainer.classList.remove('active');
            cameraContainer.classList.add('captured'); // Add captured class
            console.log("Video paused, photo capturing.");

            const context = canvas.getContext('2d');
            const width = cameraFeed.videoWidth;
            const height = cameraFeed.videoHeight;
            const size = Math.min(width, height);
            const offsetX = (width - size) / 2;
            const offsetY = (height - size) / 2;

            canvas.width = size;
            canvas.height = size;
            context.beginPath();
            context.arc(size / 2, size / 2, size / 2, 0, 2 * Math.PI);
            context.clip();

            if (facingMode === 'user') {
                context.translate(size, 0);
                context.scale(-1, 1);
            }

            context.drawImage(cameraFeed, offsetX, offsetY, size, size, 0, 0, size, size);
            context.setTransform(1, 0, 0, 1, 0, 0);

            capturedImageDataURL = canvas.toDataURL('image/jpeg');
            capturedImageDisplay.src = capturedImageDataURL;
            cameraFeed.style.display = 'none';
            capturedImageDisplay.style.display = 'block';
            showingCapturedImage = true;

            const base64Image = capturedImageDataURL.split(',')[1];
            console.log("Image captured and encoded (first 50 chars):", base64Image.substring(0, 50) + "...");

            commentContainer.classList.remove('show');
            commentContainer.classList.add('hidden');
            shareBtn.classList.add('hidden');

            sendImageForComment(base64Image);

            // Trigger confetti animation
            jsConfetti.addConfetti({
                emojis: ['🌈', '⚡️', '💥', '✨', '💫', '🌸'],
            }).then(() => jsConfetti.addConfetti());
        }

        async function sendImageForComment(base64Image) {
            console.log("Sending image data to /upload...");
            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ image: base64Image })
                });

                console.log("Fetch Response:", response);

                if (response.ok) {
                    const data = await response.json();
                    console.log("Fetch Data:", data);
                    if (data && data.comment) {
                        geminiComment = data.comment;
                        commentDisplay.textContent = geminiComment;
                        commentContainer.classList.remove('hidden');
                        commentContainer.classList.add('show');
                        shareBtn.classList.remove('hidden'); // Show the share button here!
                        console.log("Comment displayed:", geminiComment);
                    } else {
                        console.error("Error: Comment data is missing in the response.");
                        alert("Failed to get a funny comment.");
                    }
                } else {
                    const errorData = await response.json();
                    console.error("Upload failed:", errorData);
                    alert(`Error: ${errorData.error || 'Failed to get comment.'}`);
                }
            } catch (error) {
                console.error("Error sending image:", error);
                alert("Failed to send image to the server.");
            }
        }

        async function toggleCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null; // Important: Set stream to null
            }
            facingMode = facingMode === 'user' ? 'environment' : 'user';
            startCamera();
        }

        async function sharePhotoAndComment() {
            if (navigator.share) {
                try {
                    const appContainer = document.getElementById('app-container');
                    // Increase the scale for a higher resolution screenshot
                    const canvas = await html2canvas(appContainer, { scale: 2 }); // Adjust scale as needed
                    const shareDataURL = canvas.toDataURL('image/jpeg');

                    navigator.share({
                        title: 'Funny Photo Booth!',
                        files: [dataURLtoFile(shareDataURL, 'shared_photo.jpeg')],
                    });

                } catch (error) {
                    console.error('Sharing failed:', error);
                }
            } else {
                alert('Sharing is not supported on this browser.');
            }
        }

        function dataURLtoFile(dataurl, filename) {
            const arr = dataurl.split(',');
            const mime = arr[0].match(/:(.*?);/)[1];
            const bstr = atob(arr[1]);
            let n = bstr.length;
            const u8arr = new Uint8Array(n);
            while (n--) {
                u8arr[n] = bstr.charCodeAt(n);
            }
            return new File([u8arr], filename, { type: mime });
        }

        captureBtn.addEventListener('click', capturePhoto);
        flipBtn.addEventListener('click', toggleCamera);
        shareBtn.addEventListener('click', sharePhotoAndComment);
        cameraContainer.addEventListener('click', () => {
            if (showingCapturedImage) {
                startCamera();
            }
        });

        startCamera();
    </script>
</body>
</html>
