<!DOCTYPE html>
<html>
<head>
    <title>Funny Photo Booth</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Roboto:ital,wght@0,400;0,700;1,400&display=swap');

        body {
            font-family: 'Poppins', sans-serif; /* Modern and clean */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #d3d3d3; /* Bigger light grey background */
            margin: 0;
            padding: 40px; /* Increased padding for bigger background feel */
            box-sizing: border-box;
        }

        #app-container {
            background-color: #fff;
            border-radius: 15px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15); /* More pronounced shadow */
            padding: 50px; /* Increased padding */
            text-align: center;
        }

        h1 {
            color: #343a40; /* Dark grey heading */
            margin-bottom: 30px;
            font-weight: 600; /* Semi-bold */
            font-size: 2.7rem; /* Slightly larger heading */
        }

        #camera-container {
            width: 200px; /* Further increased camera container size */
            height: 200px; /* Further increased camera container size */
            border: 3px solid #adb5bd; /* Medium grey border */
            position: relative;
            overflow: hidden;
            border-radius: 50%;
            margin-bottom: 35px;
            display: flex; /* Center the video */
            justify-content: center; /* Center horizontally */
            align-items: center; /* Center vertically */
            transition: border-color 0.3s ease-in-out;
        }

        #camera-container.active {
            border-color: #00bfa5; /* Teal active color */
        }

        #camera-feed {
            width: auto; /* Adjust width to maintain aspect ratio */
            height: auto; /* Adjust height to maintain aspect ratio */
            min-width: 100%; /* Ensure it covers the container */
            min-height: 100%; /* Ensure it covers the container */
            object-fit: cover;
            transform: scaleX(-1); /* Apply horizontal flip for mirror effect */
        }

        #capture-btn {
            background-color: #00bfa5; /* Teal button */
            color: white;
            border: none;
            border-radius: 50%;
            width: 100px; /* Slightly larger button */
            height: 100px; /* Slightly larger button */
            font-size: 2rem; /* Slightly larger font */
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2); /* More prominent shadow */
            transition: transform 0.2s ease-in-out, background-color 0.2s ease-in-out;
            outline: none;
        }

        #capture-btn:hover {
            transform: scale(1.08);
            background-color: #00897b; /* Darker teal on hover */
        }

        #capture-btn:active {
            transform: scale(0.92);
        }

        #comment-container {
            margin-top: 50px; /* Increased margin */
            padding: 30px; /* Increased padding */
            border: 2px dashed #ced4da; /* Light grey dashed border */
            border-radius: 12px;
            background-color: #f8f9fa; /* Very light grey background */
            text-align: center;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
        }

        #comment-container.show {
            opacity: 1;
            transform: translateY(0);
        }

        #comment-container h2 {
            color: #495057; /* Medium grey heading */
            font-size: 2rem; /* Slightly larger font */
            margin-bottom: 20px; /* Increased margin */
            font-weight: 600;
        }

        #comment {
            font-style: italic;
            color: #6c757d; /* Slate grey comment text */
            font-size: 1.3rem; /* Slightly larger font */
        }

        .hidden {
            display: none;
        }

        /* Animation for camera container */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); } /* Even less intense pulse for larger size */
            100% { transform: scale(1); }
        }

        #camera-container.pulsing {
            animation: pulse 1.5s infinite alternate; /* Faster pulse */
        }
    </style>
</head>
<body>
    <div id="app-container">
        <h1>Say Cheese!</h1>
        <div id="camera-container" class="pulsing">
            <video id="camera-feed" autoplay playsinline style="transform: scaleX(-1);"></video>
        </div>
        <button id="capture-btn">📸</button>
        <canvas id="canvas" width="200" height="200" class="hidden"></canvas>
        <div id="comment-container" class="hidden">
            <h2>Gemini Says:</h2>
            <p id="comment"></p>
        </div>
    </div>

    <script>
        const cameraFeed = document.getElementById('camera-feed');
        const cameraContainer = document.getElementById('camera-container');
        const captureBtn = document.getElementById('capture-btn');
        const canvas = document.getElementById('canvas');
        const commentContainer = document.getElementById('comment-container');
        const commentDisplay = document.querySelector('#comment-container #comment');
        let stream;
        let isPaused = false;

        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                cameraFeed.srcObject = stream;
                cameraContainer.classList.add('active');
                cameraContainer.classList.remove('pulsing');
                console.log("Camera started successfully.");
            } catch (err) {
                console.error("Error accessing camera: ", err);
                alert("Failed to access camera. Please check your browser permissions.");
                cameraContainer.classList.remove('active');
            }
        }

        async function capturePhoto() {
            if (!stream) {
                alert("Camera not started yet.");
                return;
            }

            cameraFeed.pause();
            isPaused = true;
            cameraContainer.classList.remove('active');
            console.log("Video paused, preparing to capture.");

            const context = canvas.getContext('2d');
            const width = cameraFeed.videoWidth;
            const height = cameraFeed.videoHeight;
            const size = Math.min(width, height);
            const offsetX = (width - size) / 2;
            const offsetY = (height - size) / 2;

            canvas.width = size;
            canvas.height = size;
            context.beginPath();
            context.arc(size / 2, size / 2, size / 2, 0, 2 * Math.PI);
            context.clip();
            // Importantly, we also need to flip the drawing context horizontally
            context.translate(size, 0);
            context.scale(-1, 1);
            context.drawImage(cameraFeed, offsetX, offsetY, size, size, 0, 0, size, size);
            context.setTransform(1, 0, 0, 1, 0, 0); // Reset transform

            const imageDataURL = canvas.toDataURL('image/jpeg');
            const base64Image = imageDataURL.split(',')[1];
            console.log("Image captured and encoded (first 50 chars):", base64Image.substring(0, 50) + "...");

            commentContainer.classList.remove('show');
            commentContainer.classList.add('hidden'); // Ensure it's hidden before the timeout

            setTimeout(() => {
                sendImageForComment(base64Image);
            }, 200); // Increased delay
        }

        async function sendImageForComment(base64Image) {
            console.log("Sending image data to /upload...");
            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ image: base64Image })
                });

                console.log("Fetch Response:", response);

                if (response.ok) {
                    const data = await response.json();
                    console.log("Fetch Data:", data);
                    if (data && data.comment) {
                        commentDisplay.textContent = data.comment;
                        commentContainer.classList.remove('hidden'); // Make it visible
                        commentContainer.classList.add('show');
                        console.log("Comment displayed:", data.comment);
                    } else {
                        console.error("Error: Comment data is missing in the response.");
                        alert("Failed to get a funny comment.");
                    }
                } else {
                    const errorData = await response.json();
                    console.error("Upload failed:", errorData);
                    alert(`Error: ${errorData.error || 'Failed to get comment.'}`);
                }
            } catch (error) {
                console.error("Error sending image:", error);
                alert("Failed to send image to the server.");
            } finally {
                setTimeout(() => {
                    cameraFeed.play();
                    isPaused = false;
                    cameraContainer.classList.add('active');
                    console.log("Camera resumed.");
                }, 750); // Slightly increased resume delay
            }
        }

        captureBtn.addEventListener('click', capturePhoto);
        startCamera();
    </script>
</body>
</html>
